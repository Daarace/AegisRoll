<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2137" />
      <stop offset="100%" stop-color="#0A1523" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D179" />
      <stop offset="100%" stop-color="#D9B354" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26B9A8" />
      <stop offset="100%" stop-color="#198E80" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Geofence Radar Rings -->
  <circle cx="256" cy="245" r="185" fill="none" stroke="#26B9A8" stroke-width="2.5" stroke-opacity="0.2" stroke-dasharray="8 6" />
  <circle cx="256" cy="245" r="145" fill="none" stroke="#26B9A8" stroke-width="2.5" stroke-opacity="0.35" />
  <circle cx="256" cy="245" r="105" fill="none" stroke="#26B9A8" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="4 4" />

  <!-- Aegis Shield Silhouette -->
  <path d="M 256,95 C 330,95 385,130 385,210 C 385,325 295,385 256,410 C 217,385 127,325 127,210 C 127,130 182,95 256,95 Z" 
        fill="#0F2137" 
        stroke="url(#goldGrad)" 
        stroke-width="14" 
        filter="url(#shadow)" />

  <!-- Inner Academic Laurel & Compass Center -->
  <!-- Compass / Pin Base -->
  <path d="M 256,155 C 220,155 192,183 192,219 C 192,265 256,335 256,335 C 256,335 320,265 320,219 C 320,183 292,155 256,155 Z" 
        fill="url(#tealGrad)" />

  <!-- Academic Mortarboard in Center -->
  <path d="M 256,192 L 292,208 L 256,224 L 220,208 Z" fill="#FFFFFF" />
  <path d="M 235,217 L 235,232 C 235,239 244,244 256,244 C 268,244 277,239 277,232 L 277,217 C 271,221 264,223 256,223 C 248,223 241,221 235,217 Z" fill="#FFFFFF" opacity="0.9" />
  <!-- Tassel -->
  <path d="M 292,208 L 297,222 C 298,226 295,230 292,230 C 289,230 286,226 287,222 Z" fill="url(#goldGrad)" />

  <!-- Verification Check Dot -->
  <circle cx="256" cy="275" r="9" fill="#FFFFFF" />
  <polyline points="251,275 255,279 262,271" fill="none" stroke="#198E80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
